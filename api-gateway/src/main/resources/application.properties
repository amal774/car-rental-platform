spring.application.name=api-gateway

server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webflux.routes[0].id=car-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://CAR-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/cars/**

# Customer Service
spring.cloud.gateway.server.webflux.routes[1].id=customer-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/customers/**